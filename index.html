<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nguyễn Thị Kim Anh · Giáo viên Tiếng Anh</title>
  <meta name="description" content="Nguyễn Thị Kim Anh – Giáo viên Tiếng Anh tại Đà Nẵng." />
  <meta property="og:title" content="Nguyễn Thị Kim Anh · Giáo viên Tiếng Anh" />
  <meta property="og:type" content="website" />
  <meta name="color-scheme" content="light dark" />

  <!-- Áp dụng theme + ngôn ngữ TRƯỚC khi vẽ trang để không bị nháy màu -->
  <script>
    (function () {
      var store = null;
      try { store = window.localStorage; } catch (e) {}
      var get = function (k) { try { return store && store.getItem(k); } catch (e) { return null; } };
      var theme = get('ka-theme');
      var dark = theme ? theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', dark);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tw-config">
    // Màu dùng biến CSS (định nghĩa bên dưới) -> đổi sáng/tối chỉ cần đổi biến
    var tw = function (n) { return 'rgb(var(--' + n + ') / <alpha-value>)'; };
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            paper: tw('paper'), card: tw('card'), line: tw('line'),
            ink:   { DEFAULT: tw('ink'), soft: tw('ink-soft'), mute: tw('ink-mute') },
            brand: { DEFAULT: tw('brand'), dark: tw('brand-dark'), tint: tw('brand-tint') },
            onbrand: tw('on-brand'), chalk: tw('chalk'),
            band: tw('band'), onband: tw('on-band')
          },
          fontFamily: {
            sans:  ['"Be Vietnam Pro"', 'system-ui', 'sans-serif'],
            serif: ['Lora', 'Georgia', 'serif']
          },
          maxWidth: { page: '72rem' }
        }
      }
    };
  </script>

  <style>
    /* ---------- Bảng màu: SÁNG ---------- */
    :root {
      --paper: 250 248 243;  --card: 255 255 255;  --line: 231 227 217;
      --ink: 28 36 33;       --ink-soft: 74 85 80; --ink-mute: 108 119 114;
      --brand: 31 90 74;     --brand-dark: 22 68 58; --brand-tint: 230 239 235;
      --on-brand: 250 248 243;
      --chalk: 233 185 73;   --mark: 233 185 73 / .45;
      --band: 31 90 74;      --on-band: 250 248 243;
    }
    /* ---------- Bảng màu: TỐI ---------- */
    .dark {
      --paper: 16 20 18;     --card: 23 28 26;     --line: 45 53 49;
      --ink: 236 233 225;    --ink-soft: 190 196 191; --ink-mute: 148 157 152;
      --brand: 120 196 171;  --brand-dark: 150 214 192; --brand-tint: 29 51 44;
      --on-brand: 16 20 18;
      --chalk: 214 172 74;   --mark: 214 172 74 / .28;
      --band: 26 46 40;      --on-band: 236 233 225;
    }
    body { background: rgb(var(--paper)); color: rgb(var(--ink)); transition: background-color .25s ease, color .25s ease; }
    .mark { background: linear-gradient(transparent 62%, rgb(var(--mark)) 62%); padding: 0 .1em; }
    .reveal { opacity: 0; transform: translateY(14px); transition: opacity .6s ease, transform .6s ease; }
    .reveal.is-visible { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      body { transition: none; }
      .reveal { opacity: 1; transform: none; transition: none; }
    }
    :focus-visible { outline: 2px solid rgb(var(--brand)); outline-offset: 3px; border-radius: 6px; }
    [data-view][hidden], section[hidden] { display: none !important; }
  </style>
</head>

  <script>
  (function () {
    'use strict';
    var D = window.SITE_DATA;
    if (!D) {
      document.getElementById('loadError').hidden = false;
      document.querySelectorAll('[data-view]').forEach(function (v) { v.hidden = true; });
      return;
    }

    /* ---------------- Lưu trữ an toàn (có thể bị chặn ở chế độ ẩn danh) ---------------- */
    var store = {
      get: function (k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
      set: function (k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
    };

    /* ---------------- Ngôn ngữ ---------------- */
    var LANGS = ['vi', 'en'];
    var urlLang = new URLSearchParams(location.search).get('lang');
    var lang = LANGS.indexOf(urlLang) > -1 ? urlLang
             : LANGS.indexOf(store.get('ka-lang')) > -1 ? store.get('ka-lang')
             : ((navigator.language || 'vi').toLowerCase().indexOf('vi') === 0 ? 'vi' : 'en');

    var missing = [];
    function t(v, path) {
      if (v == null) return '';
      if (typeof v === 'string' || typeof v === 'number') return String(v);
      if (v[lang] != null) return v[lang];
      if (path) missing.push(path);
      return v.vi != null ? v.vi : '';
    }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    // **đậm**  ==tô sáng==  [[màu thương hiệu]]
    function fmt(s) {
      return esc(s)
        .replace(/\*\*(.+?)\*\*/g, '<strong class="font-semibold text-ink">$1</strong>')
        .replace(/==(.+?)==/g, '<span class="mark text-ink">$1</span>')
        .replace(/\[\[(.+?)\]\]/g, '<span class="text-brand">$1</span>');
    }
    function T(v, path) { return fmt(t(v, path)); }
    function ui(key) { return t(D.ui[key], 'ui.' + key); }
    function $(id) { return document.getElementById(id); }
    function html(id, s) { var el = $(id); if (el) el.innerHTML = s; }
    function list(arr) { return Array.isArray(arr) ? arr : []; }

    var NAV = [
      { href: '#gioi-thieu', key: 'navAbout' },
      { href: '#phuong-phap', key: 'navMethods' },
      { href: '#kinh-nghiem', key: 'navExp' },
      { href: '#thanh-tuu', key: 'navCreds' },
      { href: '#/khoa-hoc', key: 'navCourses' }
    ];

    var badge = function (text) {
      return '<span class="mt-2 inline-block text-[12px] rounded-full bg-brand-tint text-brand px-2.5 py-0.5">' + esc(text) + '</span>';
    };

    function render() {
      missing = [];
      var P = D.profile, doc = document.documentElement;
      doc.lang = lang;
      document.title = t(D.meta.title);
      var md = document.querySelector('meta[name="description"]');
      if (md) md.setAttribute('content', t(D.meta.description));
      var og = document.querySelector('meta[property="og:title"]');
      if (og) og.setAttribute('content', t(D.meta.title));

      // Chữ giao diện gắn qua data-ui
      document.querySelectorAll('[data-ui]').forEach(function (el) { el.textContent = ui(el.dataset.ui); });

      // Header
      $('logoInitials').textContent = P.initials;
      $('logoName').textContent = t(P.shortName);
      $('logoRole').textContent = t(P.role);
      $('langSwitch').setAttribute('aria-label', ui('langGroup'));
      $('themeBtn').setAttribute('aria-label', ui('themeToggle'));
      $('menuBtn').setAttribute('aria-label', ui('menuOpen'));
      document.querySelectorAll('[data-lang-btn]').forEach(function (b) {
        var on = b.dataset.langBtn === lang;
        b.setAttribute('aria-pressed', String(on));
        b.className = 'px-2.5 py-1 rounded-full transition ' + (on ? 'bg-ink text-paper' : 'text-ink-mute hover:text-ink');
      });
      var navLinks = NAV.map(function (n) { return '<a href="' + n.href + '" class="hover:text-brand">' + esc(ui(n.key)) + '</a>'; }).join('');
      html('desktopNav', navLinks +
        '<a href="#/hoc-vien" class="inline-flex items-center rounded-full border border-brand text-brand px-4 py-1.5 hover:bg-brand hover:text-onbrand transition">' + esc(ui('navPortal')) + '</a>');
      html('mobileNavList', NAV.map(function (n) { return '<a href="' + n.href + '" class="py-2.5">' + esc(ui(n.key)) + '</a>'; }).join('') +
        '<a href="#/hoc-vien" class="py-2.5 font-medium text-brand">' + esc(ui('navPortal')) + ' →</a>');

      // Hero
      $('heroEyebrow').textContent = t(P.role) + ' · ' + t(P.location);
      $('heroName').textContent = t(P.name);
      html('heroHeadline', T(D.hero.headline, 'hero.headline'));
      var q = t(D.hero.quote);
      $('heroQuote').hidden = !q; $('heroQuote').textContent = q;
      $('heroPhoto').src = P.photo;
      $('heroPhoto').alt = t(P.photoAlt);
      $('heroBadge').textContent = t(P.badge);
      $('heroBadge').parentElement.hidden = !t(P.badge);

      // Stats: viền kẻ theo vị trí ô (2 cột mobile, 4 cột desktop)
      var cellCls = [
        'py-7 pr-4 lg:border-r',
        'py-7 pl-4 lg:px-6 border-l lg:border-l-0 lg:border-r',
        'py-7 pr-4 lg:px-6 border-t lg:border-t-0 lg:border-r',
        'py-7 pl-4 lg:pl-6 border-l lg:border-l-0 border-t lg:border-t-0'
      ];
      html('stats', list(D.stats).slice(0, 4).map(function (s, i) {
        return '<div class="' + cellCls[i] + ' border-line">' +
          '<dt class="text-[13px] text-ink-mute">' + esc(t(s.label, 'stats.' + i)) + '</dt>' +
          '<dd class="mt-1 font-serif text-xl sm:text-2xl font-semibold">' + T(s.value) + '</dd></div>';
      }).join(''));

      // About
      html('aboutEyebrow', esc(t(D.about.eyebrow)));
      html('aboutTitle', T(D.about.title));
      html('aboutBody', list(D.about.paragraphs).map(function (p, i) { return '<p>' + T(p, 'about.p' + i) + '</p>'; }).join(''));

      // Methods
      html('methodsEyebrow', esc(t(D.methods.eyebrow)));
      html('methodsTitle', T(D.methods.title));
      html('methodsIntro', T(D.methods.intro));
      html('methodsList', list(D.methods.items).map(function (m, i) {
        return '<li class="bg-card p-7 reveal">' +
          '<span class="font-serif text-brand text-sm">' + String(i + 1).padStart(2, '0') + '</span>' +
          '<h3 class="mt-2 font-semibold text-lg">' + T(m.title, 'methods.' + i) + '</h3>' +
          '<p class="mt-2 text-ink-soft text-[15px]">' + T(m.text, 'methods.' + i) + '</p></li>';
      }).join(''));

      // Experience
      html('expEyebrow', esc(t(D.experience.eyebrow)));
      html('expTitle', T(D.experience.title));
      html('expList', list(D.experience.items).map(function (e, i) {
        var dot = e.current
          ? '<span class="absolute -left-[7px] top-1.5 w-3.5 h-3.5 rounded-full bg-brand ring-4 ring-paper" aria-hidden="true"></span>'
          : '<span class="absolute -left-[7px] top-1.5 w-3.5 h-3.5 rounded-full bg-card border-2 border-brand ring-4 ring-paper" aria-hidden="true"></span>';
        return '<li class="pl-7 sm:pl-10 relative reveal">' + dot +
          '<div class="flex flex-wrap items-baseline gap-x-3 gap-y-1">' +
            '<h3 class="font-serif text-xl sm:text-2xl font-semibold">' + T(e.role, 'exp.' + i) + '</h3>' +
            (e.current ? '<span class="text-[12px] font-medium rounded-full bg-brand-tint text-brand px-2.5 py-0.5">' + esc(ui('current')) + '</span>' : '') +
          '</div>' +
          '<p class="mt-1 text-ink-mute text-sm">' + esc(t(e.org)) + ' · ' + esc(t(e.period)) + '</p>' +
          '<ul class="mt-4 space-y-2 text-ink-soft text-[15.5px] list-disc pl-5 marker:text-chalk">' +
            list(e.bullets).map(function (b, j) { return '<li>' + T(b, 'exp.' + i + '.b' + j) + '</li>'; }).join('') +
          '</ul></li>';
      }).join(''));

      // Credentials
      var C = D.credentials;
      html('credEyebrow', esc(t(C.eyebrow)));
      html('credTitle', T(C.title));
      function credItems(items, prefix) {
        return list(items).map(function (c, i) {
          var meta = [t(c.org), t(c.period)].filter(Boolean).map(esc).join(' · ');
          return '<li class="' + (i ? 'pt-6 border-t border-line' : '') + '">' +
            '<p class="font-serif text-lg font-semibold leading-snug">' + T(c.name, prefix + i) + '</p>' +
            (meta ? '<p class="mt-1 text-sm text-ink-mute">' + meta + '</p>' : '') +
            (c.note ? '<p class="mt-2 text-[15px] text-ink-soft">' + T(c.note, prefix + i + '.note') + '</p>' : '') +
            (c.inProgress ? badge(ui('inProgress')) : '') + '</li>';
        }).join('');
      }
      html('eduTitle', esc(t(C.education.title)));
      html('eduList', credItems(C.education.items, 'edu.'));
      html('certTitle', esc(t(C.certificates.title)));
      html('certList', credItems(C.certificates.items, 'cert.'));
      html('compTitle', esc(t(C.competencies.title)));
      html('compList', list(C.competencies.items).map(function (c, i) {
        return '<li class="rounded-full border border-line bg-paper px-4 py-2">' + T(c, 'comp.' + i) + '</li>';
      }).join(''));

      // Testimonials – chỉ hiện khi có dữ liệu hợp lệ
      var TS = D.testimonials || {};
      var valid = list(TS.items).filter(function (x) { return x && t(x.quote) && t(x.name); });
      $('danh-gia').hidden = !valid.length;
      if (valid.length) {
        html('testiEyebrow', esc(t(TS.eyebrow)));
        html('testiTitle', T(TS.title));
        html('testiList', valid.map(function (x) {
          return '<figure class="rounded-2xl border border-line bg-card p-7 flex flex-col">' +
            '<svg class="text-chalk" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 7h4v4c0 3-2 5-4 6l-1-1.5c1.3-.8 2-2 2-3.5H7zm8 0h4v4c0 3-2 5-4 6l-1-1.5c1.3-.8 2-2 2-3.5h-1z"/></svg>' +
            '<blockquote class="mt-4 text-ink-soft flex-1">' + T(x.quote) + '</blockquote>' +
            '<figcaption class="mt-6 pt-4 border-t border-line"><span class="block font-semibold">' + esc(t(x.name)) + '</span>' +
            '<span class="block text-sm text-ink-mute">' + esc(t(x.role)) + '</span></figcaption></figure>';
        }).join(''));
      }

      // Contact
      html('contactTitle', T(D.contact.title));
      html('contactText', T(D.contact.text));
      var em = $('contactEmail');
      em.href = 'mailto:' + P.email + '?subject=' + encodeURIComponent(t(D.contact.mailSubject));
      em.querySelector('span').textContent = P.email;
      em.parentElement.hidden = !P.email;
      var ph = $('contactPhone');
      ph.href = 'tel:' + String(P.phone || '').replace(/\s/g, '');
      ph.querySelector('span').textContent = P.phoneDisplay || P.phone;
      ph.parentElement.hidden = !P.phone;
      $('contactPlace').textContent = t(P.location);

      // Footer
      $('year').textContent = new Date().getFullYear();
      $('footName').textContent = t(P.name);
      $('footRole').textContent = t(P.role);

      if (missing.length) console.warn('[site-data] Thiếu bản dịch "' + lang + '" tại:', missing);
      observeReveal();
    }

    /* ---------------- Hiệu ứng xuất hiện ---------------- */
    var firstPaint = true;
    var io = 'IntersectionObserver' in window ? new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('is-visible'); io.unobserve(en.target); } });
    }, { threshold: 0.12 }) : null;
    function observeReveal() {
      document.querySelectorAll('.reveal:not(.is-visible)').forEach(function (el) {
        // Khi đổi ngôn ngữ: hiện ngay, không chạy lại hiệu ứng
        if (!io || !firstPaint) el.classList.add('is-visible'); else io.observe(el);
      });
      firstPaint = false;
    }

    /* ---------------- Đổi ngôn ngữ ---------------- */
    document.querySelectorAll('[data-lang-btn]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (b.dataset.langBtn === lang) return;
        lang = b.dataset.langBtn;
        store.set('ka-lang', lang);
        try { var u = new URL(location.href); u.searchParams.set('lang', lang); history.replaceState(null, '', u); } catch (e) {}
        render();
      });
    });

    /* ---------------- Đổi sáng / tối ---------------- */
    $('themeBtn').addEventListener('click', function () {
      var dark = !document.documentElement.classList.contains('dark');
      document.documentElement.classList.toggle('dark', dark);
      store.set('ka-theme', dark ? 'dark' : 'light');
    });
    // Nếu người xem chưa tự chọn: đi theo cài đặt hệ thống
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onSys = function (e) { if (!store.get('ka-theme')) document.documentElement.classList.toggle('dark', e.matches); };
    if (mq.addEventListener) mq.addEventListener('change', onSys);

    /* ---------------- Menu di động ---------------- */
    var menuBtn = $('menuBtn'), mobileNav = $('mobileNav');
    function closeMenu() { mobileNav.classList.add('hidden'); menuBtn.setAttribute('aria-expanded', 'false'); }
    menuBtn.addEventListener('click', function () {
      var open = mobileNav.classList.toggle('hidden') === false;
      menuBtn.setAttribute('aria-expanded', String(open));
    });
    mobileNav.addEventListener('click', function (e) { if (e.target.closest('a')) closeMenu(); });

    /* ---------------- Router: #/, #/khoa-hoc, #/hoc-vien ; #id = neo cuộn ---------------- */
    var views = document.querySelectorAll('[data-view]');
    function showView(name) { views.forEach(function (v) { v.hidden = v.dataset.view !== name; }); }
    function route() {
      var h = location.hash;
      if (h.indexOf('#/') === 0) {
        var name = h.slice(2) || 'home';
        var ok = Array.prototype.some.call(views, function (v) { return v.dataset.view === name; });
        showView(ok ? name : 'home');
        window.scrollTo(0, 0);
      } else {
        showView('home');
        if (h.length > 1) {
          var el = document.getElementById(h.slice(1));
          if (el) requestAnimationFrame(function () { el.scrollIntoView(); });
        }
      }
      closeMenu();
    }
    window.addEventListener('hashchange', route);

    render();
    route();
  })();
  </script>
</body>
</html>
